<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111718">
  <meta name="description" content="STONE AWARDS 2026 — премия сообщества.">
  <title>STONE AWARDS 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <div id="toast" class="toast" role="status"></div>

  <div id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <div class="brand-mark">S<span>◆</span></div>
      <p class="eyebrow">THE COMMUNITY AWARDS</p>
      <h1>STONE <span>AWARDS</span></h1>
      <p class="auth-subtitle">Время отметить тех, кто сделал этот год особенным.</p>
      <div class="gold-line"></div>
      <form id="code-form" class="auth-form">
        <label for="access-code">КОД ДОСТУПА</label>
        <input id="access-code" type="text" placeholder="Например, STONE-001" autocomplete="one-time-code" maxlength="40" required>
        <button class="btn btn-gold btn-wide" type="submit">ВОЙТИ В ПРЕМИЮ <span>↗</span></button>
      </form>
      <button id="show-admin-login" class="text-button" type="button">Вход для организатора</button>
      <form id="admin-login-form" class="admin-login-form hidden">
        <div class="field">
          <label for="admin-email">EMAIL ОРГАНИЗАТОРА</label>
          <input id="admin-email" type="email" placeholder="admin@example.com" autocomplete="username">
        </div>
        <div class="field">
          <label for="admin-password">ПАРОЛЬ</label>
          <input id="admin-password" type="password" placeholder="Пароль" autocomplete="current-password">
        </div>
        <button class="btn btn-outline btn-wide" type="submit">ВОЙТИ В АДМИН-ПАНЕЛЬ</button>
      </form>
      <p class="auth-foot">PRIVATE EVENT <span>•</span> 2026</p>
    </div>
    <div class="auth-side-note">EXCELLENCE<br>DESERVES<br>RECOGNITION</div>
  </div>

  <div id="site" class="site hidden">
    <header class="topbar">
      <a href="#" class="brand" data-page="home">
        <span class="brand-symbol">S<span>◆</span></span>
        <span class="brand-name">STONE <b>AWARDS</b><small>2026 · PRIVATE CEREMONY</small></span>
      </a>
      <nav id="main-nav" class="main-nav">
        <button data-page="home" class="nav-link active">Главная</button>
        <button data-page="vote" class="nav-link">Голосование</button>
        <button data-page="results" class="nav-link">Результаты</button>
        <button data-page="admin" class="nav-link admin-nav hidden">Управление</button>
      </nav>
      <div class="topbar-right">
        <span id="user-chip" class="user-chip"></span>
        <button id="logout-btn" class="logout-btn" title="Выйти">Выйти ↗</button>
        <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Открыть меню">☰</button>
      </div>
    </header>

    <main id="page-content" class="page-content"></main>

    <footer class="footer">
      <div class="footer-brand">STONE <span>AWARDS</span></div>
      <p>AN EVENING OF EXCELLENCE · 2026</p>
      <span class="footer-seal">S◆</span>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
